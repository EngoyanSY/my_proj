name: lab_app

services:
  gpa_predict:
    image: estate_model:0
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models

  requests:
    image: test_requests:0

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    hostname: prometheus